<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hanbada Coupons</title>
  <style>
    body { font-family: sans-serif; background: #f5f5f5; margin: 0; padding: 20px; }
    .grid { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; }
    .card { width: 160px; background: #fff; border-radius: 8px; box-shadow: 0 0 8px rgba(0,0,0,0.1); overflow: hidden; cursor: pointer; text-align: center; }
    .card img { width: 100%; height: auto; }
    .expired { color: red; font-weight: bold; font-size: 14px; margin-top: 5px; }
    /* 모바일 화면에서 한 줄에 하나씩 보이도록 조정 */
    @media (max-width: 600px) {
      .card { width: 100% !important; max-width: none; }
    }
  </style>
</head>
<body>
  <h1 style="text-align:center;">Hanbada Coupons</h1>
  <div class="grid" id="couponGrid"></div>
  <script>
    const grid = document.getElementById('couponGrid');
    const KEY = 'hanbada_coupon_issue_date';
    if (!localStorage.getItem(KEY)) localStorage.setItem(KEY, Date.now());
    const issueDate = new Date(parseInt(localStorage.getItem(KEY)));
    const expiryDate = new Date(issueDate.getTime() + 7*24*60*60*1000);

    const total = 17;
    for (let i = 1; i <= total; i++) {
      const card = document.createElement('div'); card.className = 'card';
      const img = document.createElement('img'); img.src = `${i}.png`; card.appendChild(img);
      if (new Date() > expiryDate) {
        const msg = document.createElement('div'); msg.className = 'expired';
        msg.innerText = 'Expired – This coupon is no longer valid'; card.appendChild(msg);
      } else {
        card.onclick = () => {
          window.location.href = `detail.html?coupon=${i}`;
        };
      }
      grid.appendChild(card);
    }
  </script>
</body>
</html>
