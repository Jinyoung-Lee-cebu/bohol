<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tag Trip Coupons</title>
  <style>
    body { font-family: sans-serif; background: #f5f5f5; margin:0; padding:20px; }
    .grid { display:flex; flex-wrap:wrap; gap:15px; justify-content:center; margin-top:30px; }
    .card { width:160px; cursor:pointer; }
    .card img { width:100%; display:block; }
  </style>
</head>
<body>

  <!-- 1) token 파라미터 검사 -->
  <script>
    const qs = new URLSearchParams(location.search);
    const token = qs.get('token');
    if (!token) {
      return window.location.replace("not-allowed.html");
    }
    // 발급 시점: 매번 진입 시점
    const issuedAt = Date.now();
  </script>

  <!-- 2) 사무실 IP 인증 -->
  <script>
    const AUTH_KEY = 'hanbada_authenticated';
    function deny(){ window.location.replace("not-allowed.html"); }
    if (!localStorage.getItem(AUTH_KEY)) {
      fetch("https://api.ipify.org?format=json")
        .then(r=>r.json())
        .then(d=>{
          if (d.ip === "210.23.165.97") {
            localStorage.setItem(AUTH_KEY,"true");
          } else deny();
        })
        .catch(deny);
    }
  </script>

  <!-- 3) 썸네일 표시 -->
  <div class="grid" id="couponGrid"></div>
  <script>
    const grid = document.getElementById('couponGrid');
    for (let i=1; i<=17; i++){
      const card = document.createElement('div');
      card.className = 'card';
      const img = document.createElement('img');
      img.src = `${i}.png`;
      card.appendChild(img);
      card.addEventListener('click', ()=>{
        window.location.href =
          `detail.html?coupon=${i}` +
          `&token=${encodeURIComponent(token)}` +
          `&issuedAt=${issuedAt}`;
      });
      grid.appendChild(card);
    }
  </script>
</body>
</html>
