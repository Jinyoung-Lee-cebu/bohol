<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tag Trip Coupons</title>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Brush+Script&display=swap" rel="stylesheet" />
  <style>
    body { font-family: sans-serif; background: #f5f5f5; margin: 0; padding: 20px; }
    .logo-container { text-align: center; margin-top: -20px; }
    .logo { max-width: 200px; height: auto; }
    .intro { font-family: 'Nanum Brush Script', cursive; font-size: 1.5em; color: #333; margin-top: 10px; }
    .grid { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; margin-top: 30px; }
    .card {
      width: 160px; background: #fff; border-radius: 8px;
      box-shadow: 0 0 8px rgba(0,0,0,0.1); overflow: hidden;
      cursor: pointer; text-align: center;
    }
    .card img { width: 100%; height: auto; }
    @media (max-width: 600px) {
      .card { width: 100% !important; max-width: none; }
    }
  </style>
</head>
<body>

  <!-- ① 토큰·만료일 검사 -->
  <script>
    const params0 = new URLSearchParams(location.search);
    const token0   = params0.get('token');
    const expires0 = params0.get('expires');                // YYYYMMDD
    const today0   = new Date().toISOString().slice(0,10).replace(/-/g,'');
    if (!token0 || !expires0 || today0 > expires0) {
      return window.location.replace("not-allowed.html");
    }
  </script>

  <!-- ② 사무실 IP 인증 -->
  <script>
    const AUTH_KEY = 'hanbada_authenticated';
    function deny(){ window.location.replace("not-allowed.html"); }
    if (!localStorage.getItem(AUTH_KEY)) {
      fetch("https://api.ipify.org?format=json")
        .then(r=>r.json())
        .then(d=>{
          if (d.ip === "210.23.165.97") {
            localStorage.setItem(AUTH_KEY,"true");
          } else deny();
        })
        .catch(deny);
    }
  </script>

  <!-- ③ 발급 시점 기록 -->
  <script>
    const params1  = new URLSearchParams(location.search);
    const issuedAt = params1.get('issuedAt')
                     ? parseInt(params1.get('issuedAt'))
                     : Date.now();
    sessionStorage.setItem('coupon_issuedAt', issuedAt);
  </script>

  <!-- 로고 + 안내문 -->
  <div class="logo-container">
    <img src="processed_logo.png" alt="Tag Trip Logo" class="logo" />
    <p class="intro">사진을 누르면 멤버쉽 쿠폰이 제공됩니다.</p>
  </div>

  <!-- 썸네일 그리드 -->
  <div class="grid" id="couponGrid"></div>
  <script>
    const grid = document.getElementById('couponGrid');
    const total   = 17;
    const issued  = sessionStorage.getItem('coupon_issuedAt');
    for (let i = 1; i <= total; i++) {
      const card = document.createElement('div');
      card.className = 'card';
      const img = document.createElement('img');
      img.src = `${i}.png`;
      card.appendChild(img);
      card.onclick = () => {
        window.location.href =
          `detail.html?coupon=${i}&issuedAt=${issued}`;
      };
      grid.appendChild(card);
    }
  </script>
</body>
</html>
