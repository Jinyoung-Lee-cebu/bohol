<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tag Trip Coupons</title>
  <!-- Google Font for Korean handwriting style -->
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Brush+Script&display=swap" rel="stylesheet" />
  <style>
    body { font-family: sans-serif; background: #f5f5f5; margin: 0; padding: 20px; }
    .logo-container { text-align: center; margin-top: 20px; }
    .logo { max-width: 200px; height: auto; }
    .intro { font-family: 'Nanum Brush Script', cursive; font-size: 1.5em; color: #333; margin-top: 10px; }
    .grid { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; margin-top: 30px; }
    .card { width: 160px; background: #fff; border-radius: 8px; box-shadow: 0 0 8px rgba(0,0,0,0.1); overflow: hidden; cursor: pointer; text-align: center; }
    .card img { width: 100%; height: auto; }
    /* 모바일: 한 줄에 하나씩 */
    @media (max-width: 600px) {
      .card { width: 100% !important; max-width: none; }
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <img src="processed_logo.png" alt="Tag Trip Logo" class="logo" />
    <p class="intro">사진을 누르면 멤버쉽 쿠폰이 제공됩니다.</p>
  </div>
  <div class="grid" id="couponGrid"></div>
  <script>
    const grid = document.getElementById('couponGrid');
    const total = 17;
    for (let i = 1; i <= total; i++) {
      const card = document.createElement('div'); card.className = 'card';
      const img = document.createElement('img'); img.src = `${i}.png`; card.appendChild(img);
      card.onclick = () => window.location.href = `detail.html?coupon=${i}`;
      grid.appendChild(card);
    }
  </script>
</body>
</html>

<!-- detail.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coupon Detail</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; }
    /* Adjusted membership card size for optimal view */
    .membership-card { max-width: 180px; width: 60%; height: auto; margin: 0 auto; border-radius: 8px; }
    .timer { margin: 20px auto 0; text-align: center; font-weight: bold; color: green; font-size: 20px; }
    .expired { color: red; font-weight: bold; font-size: 20px; }
  </style>
</head>
<body>
  <div id="content">
    <h2 id="title">Coupon</h2>
    <img src="membership.jpg" alt="Membership Card" class="membership-card" />
    <div id="timer" class="timer"></div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const idx = params.get('coupon') || '';
    if (idx) document.getElementById('title').innerText = `Coupon ${idx}`;

    const issue = parseInt(localStorage.getItem('hanbada_coupon_issue_date') || Date.now());
    const expiry = new Date(issue + 7*24*60*60*1000);

    function updateTimer() {
      const diff = expiry - new Date();
      const el = document.getElementById('timer');
      if (diff <= 0) {
        el.className = 'expired';
        el.innerText = 'Expired – This coupon is no longer valid';
        clearInterval(tick);
      } else {
        const d = Math.floor(diff/(24*3600*1000));
        const h = Math.floor((diff/(3600*1000)) % 24);
        const m = Math.floor((diff/(60*1000)) % 60);
        const s = Math.floor((diff/1000) % 60);
        el.innerText = `Remaining: ${d}d ${h}h ${m}m ${s}s`;
      }
    }
    updateTimer();
    const tick = setInterval(updateTimer, 1000);
  </script>
</body>
</html>
