<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Coupon Detail</title>
  <style>
    body { font-family:sans-serif; text-align:center; padding:20px; }
    img { max-width:250px; width:70%; display:block; margin:20px auto; }
    .timer { font-weight:bold; color:green; font-size:24px; }
  </style>
</head>
<body>
  <!-- 1) token 파라미터 확인 -->
  <script>
    const ps = new URLSearchParams(location.search);
    if (!ps.get('token')) {
      return window.location.replace("not-allowed.html");
    }
  </script>

  <!-- 2) IP 인증 유지 -->
  <script>
    if (!localStorage.getItem('hanbada_authenticated')) {
      window.location.replace("not-allowed.html");
    }
  </script>

  <!-- 3) 쿠폰 번호 & 카드 -->
  <h2 id="title">Coupon</h2>
  <img src="membership.jpg" alt="Membership Card"/>

  <!-- 4) issuedAt 기준 7일 초단위 카운트다운 -->
  <div id="timer" class="timer"></div>
  <script>
    const params  = new URLSearchParams(location.search);
    const idx     = params.get('coupon');
    const issued  = parseInt(params.get('issuedAt'),10) || Date.now();
    if (idx) document.getElementById('title').innerText = `Coupon ${idx}`;
    const expiry = issued + 7*24*60*60*1000;
    function tick(){
      const diff = expiry - Date.now();
      if (diff <= 0) {
        return window.location.replace("not-allowed.html");
      }
      const d = Math.floor(diff/86400000),
            h = Math.floor((diff%86400000)/3600000),
            m = Math.floor((diff%3600000)/60000),
            s = Math.floor((diff%60000)/1000);
      document.getElementById('timer').textContent =
        `Remaining: ${d}d ${h}h ${m}m ${s}s`;
    }
    tick();
    setInterval(tick,1000);
  </script>
</body>
</html>
