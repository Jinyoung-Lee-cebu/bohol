<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coupon Detail</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; }
    img {
      max-width: 250px;
      width: 70%;
      height: auto;
      border-radius: 8px;
      display: block;
      margin: 0 auto;
    }
    .timer {
      margin: 20px auto 0;
      font-weight: bold;
      color: green;
      font-size: 24px;
      text-align: center;
    }
    .expired {
      color: red;
      font-weight: bold;
      font-size: 24px;
      text-align: center;
    }
  </style>
</head>
<body>
  <!-- 사무실 IP 인증 -->
  <script>
    const AUTH_KEY = 'hanbada_authenticated';
    if (!localStorage.getItem(AUTH_KEY)) {
      alert("이 쿠폰은 사무실 와이파이 연결이 필요합니다.");
      window.location.replace("not-allowed.html");
    }
  </script>

  <h2 id="title">Coupon</h2>
  <img src="membership.jpg" alt="Membership Card" />
  <div id="timer" class="timer"></div>

  <script>
    // URL에서 coupon 번호와 issuedAt(발급시점) 읽어오기
    const params   = new URLSearchParams(location.search);
    const idx      = params.get('coupon');
    const issuedAt = parseInt(params.get('issuedAt')) || Date.now();

    if (idx) {
      document.getElementById('title').innerText = `Coupon ${idx}`;
    }

    // 만료 시각 = 발급시점 + 7일
    const expiryTime = issuedAt + 7 * 24 * 60 * 60 * 1000;

    // 1초마다 남은시간 갱신
    function updateTimer() {
      const diff = expiryTime - Date.now();
      const el   = document.getElementById('timer');
      if (diff <= 0) {
        // 만료 즉시 차단
        window.location.replace("not-allowed.html");
      } else {
        const days = Math.floor(diff / (24*3600*1000));
        const hrs  = Math.floor((diff % (24*3600*1000)) / 3600000);
        const mins = Math.floor((diff % 3600000) / 60000);
        const secs = Math.floor((diff % 60000) / 1000);
        el.innerText = `Remaining: ${days}d ${hrs}h ${mins}m ${secs}s`;
      }
    }

    updateTimer();
    setInterval(updateTimer, 1000);
  </script>
</body>
</html>
