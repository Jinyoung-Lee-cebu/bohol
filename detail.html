<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Coupon Detail</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; }
    img {
      max-width: 250px;
      width: 70%;
      height: auto;
      border-radius: 8px;
      display: block;
      margin: 20px auto;
    }
    .timer {
      margin: 20px auto 0;
      font-weight: bold;
      color: green;
      font-size: 24px;
      text-align: center;
    }
  </style>
</head>
<body>
  <!-- ① 토큰·만료일 파라미터 검사 -->
  <script>
    const params = new URLSearchParams(window.location.search);
    const token  = params.get('token');
    const expires= params.get('expires');
    const today  = new Date().toISOString().slice(0,10).replace(/-/g,'');
    if (!token || !expires || today > expires) {
      window.location.replace("not-allowed.html");
    }
  </script>

  <!-- ② 사무실 IP 인증 유지 -->
  <script>
    if (!localStorage.getItem('hanbada_authenticated')) {
      window.location.replace("not-allowed.html");
    }
  </script>

  <!-- ③ 쿠폰 번호 표시 -->
  <h2 id="title">Coupon</h2>
  <img src="membership.jpg" alt="Membership Card" />

  <!-- ④ 발급 시점 기준 7일·초단위 카운트다운 -->
  <div id="timer" class="timer"></div>
  <script>
    // URL에서 coupon 번호와 issuedAt(밀리초) 가져오기
    const idx     = params.get('coupon');
    const issuedAt= parseInt(params.get('issuedAt'), 10) || Date.now();
    if (idx) {
      document.getElementById('title').innerText = `Coupon ${idx}`;
    }

    // 만료 시각 계산 (발급 시점 + 7일)
    const expiryTime = issuedAt + 7 * 24 * 60 * 60 * 1000;

    // 남은 시간 계산 및 표시 함수
    function updateTimer() {
      const now  = Date.now();
      const diff = expiryTime - now;
      if (diff <= 0) {
        // 만료 즉시 차단
        window.location.replace("not-allowed.html");
        return;
      }
      const days    = Math.floor(diff / (24 * 3600 * 1000));
      const hours   = Math.floor((diff % (24 * 3600 * 1000)) / (3600 * 1000));
      const minutes = Math.floor((diff % (3600 * 1000)) / (60 * 1000));
      const seconds = Math.floor((diff % (60 * 1000)) / 1000);
      document.getElementById('timer').textContent =
        `Remaining: ${days}d ${hours}h ${minutes}m ${seconds}s`;
    }

    // 즉시 실행 및 1초마다 갱신
    updateTimer();
    setInterval(updateTimer, 1000);
  </script>
</body>
</html>
