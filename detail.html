<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Coupon Detail</title>
  <style>
    body { font-family:sans-serif; text-align:center; padding:20px; }
    img { width:70%; max-width:250px; display:block; margin:20px auto; }
    #timer { margin-top:20px; font-size:28px; font-weight:bold; color:green; }
  </style>
</head>
<body>

  <script>
    // IP 인증 유지
    const deny = () => location.replace('not-allowed.html');
    if (!localStorage.getItem('hanbada_authenticated')) deny();

    // token 검증(오늘 토큰과 일치 여부)
    const qs = new URLSearchParams(location.search);
    const token = qs.get('token');
    if (!token) deny();
    // getTodayToken() 함수를 index.html과 똑같이 정의
    function getTodayToken() {
      const now = new Date();
      const mm = String(now.getMonth() + 1).padStart(2,'0');
      const dd = String(now.getDate()).padStart(2,'0');
      const map = {'0':'Z','1':'O','2':'T','3':'H','4':'F','5':'M','6':'S','7':'V','8':'E','9':'N'};
      const prefix = map[mm[0]] + map[mm[1]];
      const suffix = map[dd[0]] + map[dd[1]];
      return `${prefix}${Number(dd)}${suffix}`;
    }
    if (token !== getTodayToken()) deny();
  </script>

  <h2 id="title">Coupon</h2>
  <img src="membership.jpg" alt="Membership Card"/>
  <div id="timer"></div>

  <script>
    // 썸네일로부터 coupon 번호 읽기
    const idx = new URLSearchParams(location.search).get('coupon');
    if (idx) document.getElementById('title').innerText = `Coupon ${idx}`;

    // 오늘 00:00 기준으로 시간 계산
    const now = new Date();
    const issuedDate = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
    const expiry      = issuedDate + 7 * 24 * 60 * 60 * 1000;

    function updateTimer() {
      const diff = expiry - Date.now();
      if (diff <= 0) return deny();
      const d = Math.floor(diff/86400000),
            h = Math.floor((diff%86400000)/3600000),
            m = Math.floor((diff%3600000)/60000),
            s = Math.floor((diff%60000)/1000);
      document.getElementById('timer').innerText =
        `Remaining: ${d}d ${h}h ${m}m ${s}s`;
    }
    updateTimer();
    setInterval(updateTimer, 1000);
  </script>

</body>
</html>
