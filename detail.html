<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Coupon Detail</title>
  <style>
    body { font-family:sans-serif; text-align:center; padding:20px; }
    img { width:70%; max-width:250px; display:block; margin:20px auto; }
    #timer { margin-top:20px; font-size:28px; font-weight:bold; color:green; }
  </style>
</head>
<body>

  <script>
    // IP 인증 유지
    if (!localStorage.getItem('hanbada_authenticated')) {
      location.replace('not-allowed.html');
    }
    // 파라미터 검사
    const ps = new URLSearchParams(location.search);
    const token = ps.get('token');
    if (!token) location.replace('not-allowed.html');
  </script>

  <h2 id="title">Coupon</h2>
  <img src="membership.jpg" alt="Membership Card"/>
  <div id="timer"></div>

  <script>
    // coupon 번호 표시
    const idx = new URLSearchParams(location.search).get('coupon');
    if (idx) document.getElementById('title').innerText = `Coupon ${idx}`;

    // token 형식: "QR_YYYYMMDD_rand"
    const parts = token.split('_');
    const dateStr = parts[1];  // YYYYMMDD
    const year = parseInt(dateStr.slice(0,4),10),
          month = parseInt(dateStr.slice(4,6),10)-1,
          day = parseInt(dateStr.slice(6,8),10);
    // 발급 날짜 00:00:00 기준
    const issuedDate = new Date(year,month,day).getTime();
    const expiryTime = issuedDate + 7*24*60*60*1000;

    function tick(){
      const diff = expiryTime - Date.now();
      if (diff <= 0) return location.replace('not-allowed.html');
      const d = Math.floor(diff/86400000),
            h = Math.floor((diff%86400000)/3600000),
            m = Math.floor((diff%3600000)/60000),
            s = Math.floor((diff%60000)/1000);
      document.getElementById('timer').innerText =
        `Remaining: ${d}d ${h}h ${m}m ${s}s`;
    }

    tick();
    setInterval(tick,1000);
  </script>
</body>
</html>
