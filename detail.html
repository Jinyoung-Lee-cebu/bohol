<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coupon Detail</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; }
    img {
      max-width: 250px; width: 70%; height: auto;
      border-radius: 8px; display: block; margin: 20px auto;
    }
    .timer {
      margin: 20px auto 0; font-weight: bold;
      color: green; font-size: 24px; text-align: center;
    }
  </style>
</head>
<body>
  <!-- ① 토큰/만료일 파라미터 검사 -->
  <script>
    const ps2 = new URLSearchParams(location.search);
    const t2 = ps2.get('token'), e2 = ps2.get('expires');
    const today2 = new Date().toISOString().slice(0,10).replace(/-/g,'');
    if (!t2 || !e2 || today2 > e2) {
      return window.location.replace("not-allowed.html");
    }
  </script>

  <!-- ② IP 인증 유지 -->
  <script>
    if (!localStorage.getItem('hanbada_authenticated')) {
      window.location.replace("not-allowed.html");
    }
  </script>

  <!-- ③ 쿠폰 번호 표시 -->
  <h2 id="title">Coupon</h2>
  <img src="membership.jpg" alt="Membership Card" />
  <div id="timer" class="timer"></div>

  <!-- ④ issuedAt 기반 초단위 7일 카운트다운 -->
  <script>
    const ps3    = new URLSearchParams(location.search);
    const idx3   = ps3.get('coupon');
    const issued = parseInt(ps3.get('issuedAt')) || Date.now();
    if (idx3) document.getElementById('title').innerText = `Coupon ${idx3}`;

    const expiry = issued + 7*24*60*60*1000;
    function tick(){
      const diff = expiry - Date.now();
      if (diff <= 0) return window.location.replace("not-allowed.html");
      const d = Math.floor(diff/86400000),
            h = Math.floor((diff%86400000)/3600000),
            m = Math.floor((diff%3600000)/60000),
            s = Math.floor((diff%60000)/1000);
      document.getElementById('timer').innerText =
        `Remaining: ${d}d ${h}h ${m}m ${s}s`;
    }
    tick();
    setInterval(tick,1000);
  </script>
</body>
</html>
