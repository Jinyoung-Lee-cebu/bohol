<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coupon Detail</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
    }
    /* 멤버십 카드 */
    img {
      max-width: 250px;
      width: 70%;
      height: auto;
      border-radius: 8px;
      display: block;
      margin: 0 auto;
    }
    /* 남은 유효기간 */
    .timer {
      margin: 20px auto 0;
      font-weight: bold;
      color: green;
      font-size: 24px;
      text-align: center;
    }
    .expired {
      color: red;
      font-weight: bold;
      font-size: 24px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h2 id="title">Coupon</h2>
  <img src="membership.jpg" alt="Membership Card" />
  <div id="timer" class="timer"></div>

  <script>
    const params = new URLSearchParams(location.search);
    const idx = params.get('coupon') || '';
    if (idx) document.getElementById('title').innerText = `Coupon ${idx}`;

    const issue = parseInt(localStorage.getItem('hanbada_coupon_issue_date') || Date.now());
    const expiry = new Date(issue + 7*24*60*60*1000);

    function updateTimer() {
      const diff = expiry - new Date();
      const el = document.getElementById('timer');
      if (diff <= 0) {
        el.className = 'expired';
        el.innerText = 'Expired – This coupon is no longer valid';
        clearInterval(tick);
      } else {
        const days = Math.floor(diff / (24*3600*1000));
        const hours = Math.floor((diff / (3600*1000)) % 24);
        const mins = Math.floor((diff / (60*1000)) % 60);
        const secs = Math.floor((diff / 1000) % 60);
        el.innerText = `Remaining: ${days}d ${hours}h ${mins}m ${secs}s`;
      }
    }
    updateTimer();
    const tick = setInterval(updateTimer, 1000);
  </script>
</body>
</html>
