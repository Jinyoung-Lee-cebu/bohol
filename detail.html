<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coupon Detail</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; }
    img {
      max-width: 250px; width: 70%; height: auto;
      border-radius: 8px; display: block; margin: 20px auto;
    }
    .timer {
      margin: 20px auto 0; font-weight: bold;
      color: green; font-size: 24px; text-align: center;
    }
  </style>
</head>
<body>
  <!-- ① 토큰·만료일 재검사 -->
  <script>
    const p0 = new URLSearchParams(location.search);
    const t0 = p0.get('token'), e0 = p0.get('expires');
    const today = new Date().toISOString().slice(0,10).replace(/-/g,'');
    if (!t0 || !e0 || today > e0) {
      window.location.replace("not-allowed.html");
    }
  </script>

  <!-- ② IP 인증 유지 확인 -->
  <script>
    if (!localStorage.getItem('hanbada_authenticated')) {
      window.location.replace("not-allowed.html");
    }
  </script>

  <!-- ③ 쿠폰 번호 표시 -->
  <h2 id="title">Coupon</h2>
  <img src="membership.jpg" alt="Membership Card" />
  <div id="timer" class="timer"></div>

  <!-- ④ issuedAt 기반 초단위 7일 카운트다운 & 만료 차단 -->
  <script>
    const params = new URLSearchParams(location.search);
    const idx    = params.get('coupon');
    const at     = parseInt(params.get('issuedAt')) || Date.now();
    if (idx) document.getElementById('title').innerText = `Coupon ${idx}`;

    const expiry = at + 7*24*60*60*1000;
    function upd(){
      const diff = expiry - Date.now();
      if (diff <= 0) {
        return window.location.replace("not-allowed.html");
      }
      const d = Math.floor(diff/86400000),
            h = Math.floor((diff%86400000)/3600000),
            m = Math.floor((diff%3600000)/60000),
            s = Math.floor((diff%60000)/1000);
      document.getElementById('timer').innerText =
        `Remaining: ${d}d ${h}h ${m}m ${s}s`;
    }
    upd(); setInterval(upd,1000);
  </script>
</body>
</html>
