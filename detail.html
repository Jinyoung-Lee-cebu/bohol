<!-- detail.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Coupon Detail</title>
  <style>
    body { font-family:sans-serif; text-align:center; padding:20px; }
    img {
      max-width:250px; width:70%; height:auto;
      border-radius:8px; display:block; margin:20px auto;
    }
    .timer {
      margin:20px auto 0; font-weight:bold;
      color:green; font-size:24px; text-align:center;
    }
  </style>
</head>
<body>

  <!-- 1) 토큰 파라미터 검사 -->
  <script>
    const params = new URLSearchParams(location.search);
    if (!params.get('token')) {
      window.location.replace("not-allowed.html");
    }
  </script>

  <!-- 2) IP 인증 유지 -->
  <script>
    if (!localStorage.getItem('hanbada_authenticated')) {
      window.location.replace("not-allowed.html");
    }
  </script>

  <!-- 3) 쿠폰 번호 표시 -->
  <h2 id="title">Coupon</h2>
  <img src="membership.jpg" alt="Membership Card"/>

  <!-- 4) issuedAt 기반 7일·초단위 카운트다운 -->
  <div id="timer" class="timer"></div>
  <script>
    const ps = new URLSearchParams(location.search);
    const idx = ps.get('coupon');
    const issuedAt = parseInt(ps.get('issuedAt'),10) || Date.now();
    if (idx) document.getElementById('title').innerText = `Coupon ${idx}`;

    const expiryTime = issuedAt + 7 * 24 * 60 * 60 * 1000;
    function updateTimer() {
      const diff = expiryTime - Date.now();
      if (diff <= 0) {
        return window.location.replace("not-allowed.html");
      }
      const days    = Math.floor(diff / 86400000);
      const hours   = Math.floor((diff % 86400000) / 3600000);
      const minutes = Math.floor((diff % 3600000)  / 60000);
      const seconds = Math.floor((diff % 60000)     / 1000);
      document.getElementById('timer').textContent =
        `Remaining: ${days}d ${hours}h ${minutes}m ${seconds}s`;
    }
    updateTimer();
    setInterval(updateTimer, 1000);
  </script>

</body>
</html>
